name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on node ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: ${{ github.actor == 'dependabot[bot]' && fromJSON('[24]') || fromJSON('[20, 22, 23, 24]') }}
    env:
      CI: true

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint ESLint
        run: npm run lint

      - name: Lint Prettier
        run: npm run lint:prettier

      - name: Build action bundle
        run: npm run action

      - name: Verify action bundle is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date with source. Run 'npm run build && npm run action' and commit the result."
            exit 1
          fi
