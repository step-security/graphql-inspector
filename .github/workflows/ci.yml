name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Test on node ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: ${{ github.actor == 'dependabot[bot]' && fromJSON('[24]') || fromJSON('[20, 22, 23, 24]') }}
    env:
      CI: true

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint ESLint
        run: npm run lint

      - name: Lint Prettier
        run: npm run lint:prettier

      - name: Build action bundle
        run: npm run action

      - name: Verify action bundle is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date with source. Run 'npm run build && npm run action' and commit the result."
            exit 1
          fi
